  <body>
    <div id="root">
      <!-- Native HTML/CSS Preloader before React mounts -->
      <style>
        .preloader-bg {
          position: fixed; inset: 0; z-index: 9999;
          background-color: #FAF8F5;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .preloader-spinner {
          width: 40px; height: 40px; border: 4px solid #E5E7EB; border-top-color: #C5221F; border-radius: 50%;
          animation: spin 0.8s linear infinite;
          margin-top: 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
      <div class="preloader-bg">
        <img src="/logo.png" alt="PUBLIC SPARK" style="height: 85px; width: auto;" />
        <div class="preloader-spinner"></div>
        <p style="margin-top: 1rem; color: #6B7280; font-weight: 600; font-size: 0.9rem;">Opening Independent Newsroom...</p>
      </div>
    </div>
