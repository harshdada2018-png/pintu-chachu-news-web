  <body>
    <div id="root">
      <!-- Native HTML/CSS Preloader before React mounts -->
      <style>
        .preloader-bg {
          position: fixed; inset: 0; z-index: 9999;
          background-color: #FAF8F5;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .preloader-spinner {
          width: 40px; height: 40px; border: 4px solid #E5E7EB; border-top-color: #C5221F; border-radius: 50%;
          animation: spin 0.8s linear infinite;
          margin-top: 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
      <div class="preloader-bg">
        <img src="/logo.png" alt="PUBLIC SPARK" style="height: 85px; width: auto;" />
        <div class="preloader-spinner"></div>
        <p id="preloader-status" style="margin-top: 1rem; color: #6B7280; font-weight: 600; font-size: 0.9rem;">Opening Independent Newsroom...</p>
      </div>
    </div>
    <script>
      // 3.5s Timeout Watchdog if React takes longer to mount
      setTimeout(function() {
        var status = document.getElementById('preloader-status');
        if (status && document.querySelector('.preloader-bg')) {
          status.innerHTML = 'Taking longer than expected... <br>' +
            '<button onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload();" style="margin-top: 10px; background: #C5221F; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer;">Force Fresh Reload</button>' +
            '<div style="font-size: 0.72rem; color: #9CA3AF; margin-top: 8px; font-family: monospace;">URL: ' + window.location.href + '</div>' +
            (window.location.protocol === 'file:' ? '<br><a href="http://localhost:5173/" style="display:inline-block;margin-top:6px;color:#C5221F;font-weight:bold;">Click here to switch to http://localhost:5173/</a>' : '');
        }
      }, 3500);
    </script>
        <script type="module" src="/src/main.jsx"></script>
