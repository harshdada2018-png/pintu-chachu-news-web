<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Auto-redirect to local dev server if double-clicked from Windows File Explorer
      if (window.location.protocol === 'file:') {
        window.location.href = 'http://localhost:5173/';
      }
    </script>
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PUBLIC SPARK - Independent Digital Newsroom</title>
    <!-- Google Fonts: Playfair Display (High-End Editorial Serif) & Plus Jakarta Sans (Modern Sans-Serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600..900;1,600..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <!-- Native HTML/CSS Preloader before React mounts -->
      <style>
        .preloader-bg {
          position: fixed; inset: 0; z-index: 9999;
          background-color: #FAF8F5;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .preloader-spinner {
          width: 40px; height: 40px; border: 4px solid #E5E7EB; border-top-color: #C5221F; border-radius: 50%;
          animation: spin 0.8s linear infinite;
          margin-top: 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
      <div class="preloader-bg">
        <img src="/logo.png" alt="PUBLIC SPARK" style="height: 85px; width: auto;" />
        <div class="preloader-spinner"></div>
        <p style="margin-top: 1rem; color: #6B7280; font-weight: 600; font-size: 0.9rem;">Opening Independent Newsroom...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
